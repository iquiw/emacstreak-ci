name: Generate card

on:
  schedule: # execute every 24 hours
    - cron: "* */24 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          repository: iquiw/emacstreak
          path: emacstreak

      - name: Setup Emacs
        uses: purcell/setup-emacs@master
        with:
          version: 30.2

      - name: Generate streak stats card
        run: |
          emacs --batch -L emacstreak -l emacstreak/emacstreak.el --eval '(emacstreak-save-svg "iquiw" "emacsstreak.svg")'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add emacsstreak.svg
          git commit -m "Update GitHub streak stats cards" || exit 0
          git push
